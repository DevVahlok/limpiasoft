<h2 mat-dialog-title>Cambiar PIN</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div mat-dialog-content class="fields">
    <div class="campo-pin">
      <label class="etiqueta-pin">Nuevo PIN</label>
      <app-pin-input formControlName="nuevoPin"></app-pin-input>
    </div>

    <div class="campo-pin">
      <label class="etiqueta-pin">Confirmar PIN</label>
      <app-pin-input formControlName="confirmarPin"></app-pin-input>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando">
      <mat-spinner *ngIf="guardando" diameter="18"></mat-spinner>
      <span *ngIf="!guardando">Guardar</span>
    </button>
  </div>
</form>

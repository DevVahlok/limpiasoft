<mat-toolbar color="primary">
  <button mat-icon-button *ngIf="responsive.isTabletOrHandset()" (click)="sidenav.toggle()" aria-label="Abrir menú">
    <mat-icon>menu</mat-icon>
  </button>
  <img src="assets/img/logo-icon.png" alt="" class="logo-icon" />
  <span>Limpiasoft</span>
  <span class="empresa-label" *ngIf="profile()?.empresa?.nombre">· {{ profile()?.empresa?.nombre }}</span>
  <span class="spacer"></span>
  <span class="user-label" *ngIf="!responsive.isHandset()">{{ profile()?.nombre_completo }}</span>
  <button mat-icon-button (click)="cambiarPin()" aria-label="Cambiar PIN">
    <mat-icon>lock_reset</mat-icon>
  </button>
  <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="banner-pausada" *ngIf="profile()?.empresa?.pausada">
  <mat-icon>lock</mat-icon>
  Esta empresa está en modo solo lectura por falta de pago. Contacta con el desarrollador para reactivarla.
</div>

<mat-sidenav-container class="shell-container">
  <mat-sidenav
    [mode]="responsive.isTabletOrHandset() ? 'over' : 'side'"
    [opened]="!responsive.isTabletOrHandset()"
    class="sidenav"
  >
    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let link of links"
        [routerLink]="link.path"
        routerLinkActive="active-link"
        (click)="cerrarSiEsMovil()"
      >
        <mat-icon
          matListItemIcon
          [matBadge]="incidenciasService.pendientesCount()"
          [matBadgeHidden]="link.path !== 'incidencias' || incidenciasService.pendientesCount() === 0"
          matBadgeColor="warn"
          matBadgeSize="small"
          >{{ link.icon }}</mat-icon
        >
        <span matListItemTitle>{{ link.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

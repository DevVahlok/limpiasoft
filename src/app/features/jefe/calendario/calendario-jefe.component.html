<div class="header">
  <h1>Calendario</h1>
  <button mat-flat-button color="primary" (click)="abrirNuevoTurno()">
    <mat-icon>event_available</mat-icon>
    Nuevo turno
  </button>
</div>

<app-calendario-mes [turnos]="turnos()" (mesCambiado)="onMesCambiado($event)" (diaClick)="onDiaClick($event)">
</app-calendario-mes>

<div class="header">
  <h1>Usuarios</h1>
  <button mat-flat-button color="primary" (click)="abrirFormulario()">
    <mat-icon>person_add</mat-icon>
    Nuevo usuario
  </button>
</div>

<mat-spinner *ngIf="loading()" diameter="32"></mat-spinner>

<table mat-table [dataSource]="empleados()" *ngIf="!loading()" class="mat-elevation-z1">
  <ng-container matColumnDef="nombre_completo">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let e">{{ e.nombre_completo }}</td>
  </ng-container>

  <ng-container matColumnDef="rol">
    <th mat-header-cell *matHeaderCellDef>Rol</th>
    <td mat-cell *matCellDef="let e">{{ e.rol === 'jefe' ? 'Jefe' : 'Empleado' }}</td>
  </ng-container>

  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let e">{{ e.username }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Teléfono</th>
    <td mat-cell *matCellDef="let e">{{ e.telefono || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="activo">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let e">{{ e.activo ? 'Activo' : 'Inactivo' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<p *ngIf="!loading() && empleados().length === 0" class="empty">Todavía no hay usuarios dados de alta.</p>

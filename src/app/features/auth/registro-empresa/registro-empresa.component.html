<div class="auth-page">
  <mat-card class="auth-card">
    <img src="assets/img/logo.png" alt="LimpiaSoft" class="logo" />
    <h1>Registra tu empresa</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre de la empresa</mat-label>
        <input matInput formControlName="nombreEmpresa" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Tu nombre completo</mat-label>
        <input matInput formControlName="nombreCompleto" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>PIN</mat-label>
        <input matInput type="password" formControlName="pin" inputmode="numeric" maxlength="4" />
      </mat-form-field>
      <p class="hint">Tu usuario se generará automáticamente a partir de tu nombre. El PIN por defecto es 0000; puedes cambiarlo luego.</p>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="form.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Crear empresa</span>
      </button>
    </form>

    <p class="register-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </mat-card>
</div>

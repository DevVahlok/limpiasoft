<div class="auth-page">
  <mat-card class="auth-card">
    <img src="assets/img/logo.png" alt="LimpiaSoft" class="logo" />
    <h1>Iniciar sesión</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Usuario</mat-label>
        <input matInput formControlName="username" autocomplete="username" placeholder="nombre.apellido" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>PIN</mat-label>
        <input
          matInput
          type="password"
          formControlName="pin"
          inputmode="numeric"
          maxlength="4"
          autocomplete="current-password"
        />
      </mat-form-field>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="form.invalid || loading">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Entrar</span>
      </button>
    </form>

    <p class="register-link">¿Tu empresa aún no está registrada? <a routerLink="/registro">Regístrala aquí</a></p>
  </mat-card>
</div>

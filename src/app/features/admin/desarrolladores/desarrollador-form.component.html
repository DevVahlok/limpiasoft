<h2 mat-dialog-title>{{ esEdicion ? 'Editar desarrollador' : 'Nuevo desarrollador' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div mat-dialog-content class="fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre completo</mat-label>
      <input matInput formControlName="nombreCompleto" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" [readonly]="esEdicion" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" *ngIf="!esEdicion">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password" />
    </mat-form-field>
    <p class="hint" *ngIf="!esEdicion">Mínimo 8 caracteres.</p>
    <p class="hint" *ngIf="esEdicion">El email no se puede cambiar una vez creada la cuenta.</p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando">
      <mat-spinner *ngIf="guardando" diameter="18"></mat-spinner>
      <span *ngIf="!guardando">Guardar</span>
    </button>
  </div>
</form>

<h2 mat-dialog-title>Resetear contraseña de {{ data.nombreCompleto }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div mat-dialog-content class="fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password" />
    </mat-form-field>
    <p class="hint">Mínimo 8 caracteres.</p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando">
      <mat-spinner *ngIf="guardando" diameter="18"></mat-spinner>
      <span *ngIf="!guardando">Resetear</span>
    </button>
  </div>
</form>

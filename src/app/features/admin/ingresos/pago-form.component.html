<h2 mat-dialog-title>{{ esEdicion ? 'Editar pago' : 'Registrar pago' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div mat-dialog-content class="fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Empresa</mat-label>
      <mat-select formControlName="empresaId" (selectionChange)="onEmpresaSeleccionada($event.value)">
        <mat-option *ngFor="let e of data.empresas" [value]="e.id">{{ e.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Importe (€)</mat-label>
      <input matInput type="number" step="0.01" min="0" formControlName="importe" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha</mat-label>
      <input matInput type="date" formControlName="fecha" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notas (opcional)</mat-label>
      <textarea matInput formControlName="notas" rows="2"></textarea>
    </mat-form-field>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando">
      <mat-spinner *ngIf="guardando" diameter="18"></mat-spinner>
      <span *ngIf="!guardando">Guardar</span>
    </button>
  </div>
</form>

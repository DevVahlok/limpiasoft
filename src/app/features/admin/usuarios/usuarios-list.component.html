<div class="header">
  <div>
    <a routerLink="/admin/empresas" class="volver">&larr; Empresas</a>
    <h1>Usuarios de {{ nombreEmpresa() }}</h1>
  </div>
  <button mat-flat-button color="primary" (click)="abrirFormulario(null)">
    <mat-icon>person_add</mat-icon>
    Nuevo usuario
  </button>
</div>

<mat-spinner *ngIf="loading()" diameter="32"></mat-spinner>

<div class="tabla-contenedor" *ngIf="!loading()">
<table mat-table [dataSource]="usuarios()" class="mat-elevation-z1">
  <ng-container matColumnDef="nombre_completo">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let u">{{ u.nombre_completo }}</td>
  </ng-container>

  <ng-container matColumnDef="rol">
    <th mat-header-cell *matHeaderCellDef>Rol</th>
    <td mat-cell *matCellDef="let u">{{ u.rol === 'jefe' ? 'Jefe' : 'Empleado' }}</td>
  </ng-container>

  <ng-container matColumnDef="username">
    <th mat-header-cell *matHeaderCellDef>Usuario</th>
    <td mat-cell *matCellDef="let u">{{ u.username }}</td>
  </ng-container>

  <ng-container matColumnDef="telefono">
    <th mat-header-cell *matHeaderCellDef>Teléfono</th>
    <td mat-cell *matCellDef="let u">{{ u.telefono || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="activo">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let u">
      <mat-chip [ngClass]="u.activo ? 'chip-activo' : 'chip-inactivo'">{{ u.activo ? 'Activo' : 'Inactivo' }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let u" class="acciones">
      <button mat-icon-button (click)="abrirFormulario(u)" aria-label="Editar usuario">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button (click)="resetearPin(u)" aria-label="Resetear PIN">
        <mat-icon>lock_reset</mat-icon>
      </button>
      <button mat-icon-button (click)="cambiarActivo(u)" [attr.aria-label]="u.activo ? 'Desactivar usuario' : 'Activar usuario'">
        <mat-icon>{{ u.activo ? 'toggle_on' : 'toggle_off' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="eliminar(u)" aria-label="Eliminar usuario">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>
</div>

<p *ngIf="!loading() && usuarios().length === 0" class="empty">Esta empresa todavía no tiene usuarios.</p>

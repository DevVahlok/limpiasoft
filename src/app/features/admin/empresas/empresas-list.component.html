<div class="header">
  <h1>Empresas</h1>
  <button mat-flat-button color="primary" (click)="abrirFormulario(null)">
    <mat-icon>add_business</mat-icon>
    Nueva empresa
  </button>
</div>

<mat-spinner *ngIf="loading()" diameter="32"></mat-spinner>

<table mat-table [dataSource]="empresas()" *ngIf="!loading()" class="mat-elevation-z1">
  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let e">{{ e.nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="nif">
    <th mat-header-cell *matHeaderCellDef>NIF</th>
    <td mat-cell *matCellDef="let e">{{ e.nif || '—' }}</td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let e">
      <mat-chip [ngClass]="e.pausada ? 'chip-pausada' : 'chip-activa'">{{ e.pausada ? 'Pausada' : 'Activa' }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="acciones">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let e" class="acciones">
      <button mat-icon-button (click)="verUsuarios(e)" aria-label="Ver usuarios">
        <mat-icon>group</mat-icon>
      </button>
      <button mat-icon-button (click)="abrirFormulario(e)" aria-label="Editar empresa">
        <mat-icon>edit</mat-icon>
      </button>
      <button
        mat-icon-button
        (click)="cambiarPausa(e)"
        [attr.aria-label]="e.pausada ? 'Reanudar empresa' : 'Pausar empresa'"
      >
        <mat-icon>{{ e.pausada ? 'play_circle' : 'pause_circle' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="eliminar(e)" aria-label="Eliminar empresa">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let row; columns: columnas"></tr>
</table>

<p *ngIf="!loading() && empresas().length === 0" class="empty">Todavía no hay empresas registradas.</p>

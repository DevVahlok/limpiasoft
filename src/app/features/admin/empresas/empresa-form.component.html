<h2 mat-dialog-title>{{ esEdicion ? 'Editar empresa' : 'Nueva empresa' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <div mat-dialog-content class="fields">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>NIF (opcional)</mat-label>
      <input matInput formControlName="nif" />
    </mat-form-field>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando">
      <mat-spinner *ngIf="guardando" diameter="18"></mat-spinner>
      <span *ngIf="!guardando">Guardar</span>
    </button>
  </div>
</form>

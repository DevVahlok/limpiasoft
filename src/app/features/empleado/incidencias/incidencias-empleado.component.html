<div class="header">
  <h1>Incidencias</h1>
  <button mat-flat-button color="primary" (click)="abrirFormulario()">
    <mat-icon>report_problem</mat-icon>
    Nueva incidencia
  </button>
</div>

<mat-spinner *ngIf="loading()" diameter="32"></mat-spinner>

<div class="lista" *ngIf="!loading()">
  <div class="tarjeta" *ngFor="let i of incidencias()">
    <div class="cabecera-tarjeta">
      <span class="tipo">{{ etiquetasTipo[i.tipo] }}</span>
      <span class="estado" [ngClass]="'estado-' + i.estado">{{ etiquetasEstado[i.estado] }}</span>
    </div>
    <p class="descripcion">{{ i.descripcion }}</p>
    <p class="turno" *ngIf="i.turno">
      Turno del {{ i.turno.fecha | fechaEs }} · {{ i.turno.puesto?.nombre || '—' }}
    </p>
    <p class="fecha">{{ i.created_at | date: 'dd-MM-yyyy HH:mm' }}</p>
  </div>

  <p *ngIf="incidencias().length === 0" class="vacio">No has reportado ninguna incidencia todavía.</p>
</div>

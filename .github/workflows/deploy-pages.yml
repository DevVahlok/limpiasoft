name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production --base-href /limpiasoft/
      # GitHub Pages no puede redirigir una ruta interna (/jefe/calendario) al index.html en
      # un refresco directo. Sirve 404.html para cualquier ruta que no exista como archivo, así
      # que si es una copia del propio index.html, Angular arranca igual y el router ya lee la
      # ruta real desde la URL — URLs limpias, sin necesidad de hash routing.
      - run: cp dist/limpiasoft/index.html dist/limpiasoft/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/limpiasoft

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
